model_params:
  name: 'ConditionalVAE'
  latent_dim: 128

data_params:
  data_path: "/content/drive/MyDrive/ECE_175B_Final_Project/Chip_Layouts/Chip_Dataset_4.0.pt"
  train_batch_size: 1
  val_batch_size:  1
  patch_size: 64
  num_workers: 2

exp_params:
  LR: 0.001
  weight_decay: 0.0
  kld_weight: 0.0
  manual_seed: 42

soft_drc_params:
  use_soft_drc: False
  overlap_weight: 20.0
  area_weight: 8.0
  thermal_weight: 4.0

trainer_params:
  accelerator: "gpu" 
  devices: 1          
  resume_ckpt_path: null
  overfit_batches: 1
  max_epochs: 100

logging_params:
  save_dir: "/content/drive/MyDrive/ECE_175B_Final_Project/Vanilla_CVAE_Checkpoints/"
  name: "Soft_DRC_Training"

  
