model_params:
  name: 'ConditionalVAE'
  latent_dim: 128

data_params:
  data_path: "/content/drive/MyDrive/ECE_175B_Final_Project/Chip_Layouts/Chip_Dataset_4.0.pt"
  train_batch_size: 64
  val_batch_size:  64
  patch_size: 64
  num_workers: 2

exp_params:
  LR: 0.001
  weight_decay: 0.0
  kld_weight: 0.00020
  manual_seed: 42

soft_drc_params:
  use_soft_drc: True
  overlap_weight: 0.0
  area_weight: 2000.0
  thermal_weight: 50.0
  target_area: 100.0
  sharpness_weight: 3000.0
  cohesion_weight: 50.0
  vanilla_weight: 3000.0
  warmup_epochs: 0.0

trainer_params:
  accelerator: "gpu" 
  devices: 1          
  resume_ckpt_path: "/content/checkpoints/ConditionalVAE/version_0/checkpoints/last.ckpt"
  limit_train_batches: 0.1
  limit_val_batches: 0.1
  max_epochs: 120

logging_params:
  save_dir: "/content/checkpoints/"

  
